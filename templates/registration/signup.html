
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>ثبت‌نام | SmartFinance AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 15% 20%, rgba(37,99,235,.18), transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(124,58,237,.16), transparent 35%),
                #080f1e;
            color: #e2e8f0;
            font-family: Tahoma, Arial, sans-serif;
        }

        .signup-container {
            width: 100%;
            max-width: 510px;
            animation: signupFadeIn .7s ease both;
        }

        @keyframes signupFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: linear-gradient(135deg,#0284c7,#6366f1);
            box-shadow: 0 0 35px rgba(56,189,248,.2);
            color: white;
            font-size: 27px;
            font-weight: 900;
        }

        .brand h1 {
            margin: 0;
            font-size: 23px;
            background: linear-gradient(90deg,#7dd3fc,#a5b4fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .brand p {
            color: #94a3b8;
            font-size: 12px;
            margin-top: 10px;
        }

        .signup-box {
            padding: 28px;
            border-radius: 21px;
            background: rgba(15,23,42,.8);
            border: 1px solid rgba(148,163,184,.17);
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
            backdrop-filter: blur(18px);
        }

        .signup-box h2 {
            color: #f1f5f9;
            font-size: 19px;
            margin: 0 0 10px;
        }

        .signup-description {
            color: #94a3b8;
            font-size: 12px;
            line-height: 2;
            margin-bottom: 23px;
        }

        .signup-box form p {
            margin: 0 0 17px;
        }

        .signup-box label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: bold;
        }

        .signup-box input,
        .signup-box select,
        .signup-box textarea {
            display: block;
            width: 100%;
            min-height: 46px;
            padding: 11px 13px;
            border-radius: 10px;
            border: 1px solid #334155;
            outline: none;
            background: rgba(8,15,30,.85);
            color: #f8fafc;
            font-family: inherit;
            font-size: 12px;
            transition: border-color .25s ease,
                        box-shadow .25s ease;
        }

        .signup-box input:focus,
        .signup-box select:focus,
        .signup-box textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56,189,248,.1);
        }

        .signup-box input::placeholder {
            color: #64748b;
        }

        .signup-box .helptext {
            display: block;
            margin-top: 7px;
            color: #94a3b8;
            font-size: 10px;
            line-height: 1.9;
        }

        .signup-box ul {
            padding-right: 19px;
            margin: 8px 0 0;
            color: #94a3b8;
            font-size: 10px;
            line-height: 2;
        }

        .signup-box .errorlist {
            color: #fda4af;
            margin: 7px 0;
        }

        .signup-box .errorlist li {
            margin-bottom: 4px;
        }

        .signup-box .nonfield {
            padding: 12px;
            border-radius: 10px;
            background: rgba(244,63,94,.1);
            border: 1px solid rgba(244,63,94,.25);
            color: #fda4af;
        }

        .signup-button {
            width: 100%;
            min-height: 49px;
            margin-top: 8px;
            border: 1px solid rgba(125,211,252,.25);
            border-radius: 11px;
            background: linear-gradient(110deg,#0284c7,#4f46e5);
            color: white;
            font-family: inherit;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 8px 23px rgba(37,99,235,.2);
            transition: transform .25s ease,
                        box-shadow .25s ease,
                        filter .25s ease;
        }

        .signup-button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 12px 28px rgba(37,99,235,.3);
        }

        .login-link {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(148,163,184,.13);
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }

        a {
            color: #7dd3fc;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            color: #bae6fd;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            color: #475569;
            font-size: 10px;
        }

        @media (max-width: 480px) {
            .signup-box {
                padding: 22px 18px;
            }

            .brand h1 {
                font-size: 21px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <main class="signup-container">

        <div class="brand">

            <div class="brand-icon">
                SF
            </div>

            <h1>SmartFinance AI</h1>

            <p>
                مدیریت هوشمند امور مالی شخصی و سازمانی
            </p>

        </div>


        <section class="signup-box">

            <h2>ساخت حساب کاربری</h2>

            <p class="signup-description">
                برای شروع استفاده از امکانات SmartFinance AI،
                اطلاعات موردنیاز را وارد کنید.
            </p>


            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="signup-button">
                    ایجاد حساب کاربری
                </button>

            </form>


            <div class="login-link">
                قبلاً حساب کاربری ساخته‌ای؟
                <a href="/accounts/login/">
                    وارد شو
                </a>
            </div>

        </section>


        <div class="footer">
            SmartFinance AI · Intelligent Financial Management
        </div>

    </main>

</body>
</html>
