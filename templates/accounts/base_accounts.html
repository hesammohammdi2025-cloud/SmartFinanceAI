
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}مدیریت سازمان{% endblock %} | SmartFinance AI</title>

    <style>
        :root {
            --bg-main: #080d1b;
            --bg-secondary: #0f172a;
            --glass: rgba(15, 23, 42, 0.78);
            --glass-light: rgba(30, 41, 59, 0.68);
            --border: rgba(148, 163, 184, 0.16);
            --border-glow: rgba(56, 189, 248, 0.38);
            --primary: #38bdf8;
            --secondary: #818cf8;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --success: #34d399;
            --danger: #fb7185;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 18px;
            overflow-x: hidden;
            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(56, 189, 248, 0.13),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(129, 140, 248, 0.13),
                    transparent 35%
                ),
                linear-gradient(135deg, #080d1b, #0f172a 55%, #111827);
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: .18;
            pointer-events: none;
            z-index: -1;
        }

        body::before {
            background: #0ea5e9;
            top: -150px;
            right: -100px;
        }

        body::after {
            background: #6366f1;
            bottom: -160px;
            left: -100px;
        }

        .container {
            width: 100%;
            max-width: 540px;
            position: relative;
            animation: accountFadeIn .7s ease both;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand h2 {
            display: inline-block;
            margin: 0 0 10px;
            font-size: 29px;
            font-weight: 900;
            letter-spacing: -.8px;
            background: linear-gradient(
                100deg,
                #38bdf8,
                #818cf8,
                #c084fc
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 16px rgba(56, 189, 248, .2));
        }

        .brand p {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.9;
            margin: 0;
        }

        .card {
            position: relative;
            overflow: hidden;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 34px;
            box-shadow:
                0 25px 70px rgba(0, 0, 0, .38),
                inset 0 1px 0 rgba(255, 255, 255, .035);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            right: 12%;
            left: 12%;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(56, 189, 248, .75),
                rgba(129, 140, 248, .65),
                transparent
            );
        }

        .card h1 {
            font-size: 22px;
            font-weight: 800;
            margin: 0 0 13px;
            color: #f8fafc;
            line-height: 1.8;
        }

        .card h2,
        .card h3 {
            color: #e2e8f0;
        }

        .description {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 2.1;
            margin-bottom: 27px;
        }

        .form-group {
            margin-bottom: 21px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 700;
            color: #cbd5e1;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid rgba(148, 163, 184, .22);
            border-radius: 12px;
            background: rgba(8, 15, 30, .78);
            color: #f8fafc;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 13px;
            outline: none;
            transition: border-color .25s ease,
                        box-shadow .25s ease,
                        background .25s ease;
        }

        input::placeholder,
        textarea::placeholder {
            color: #64748b;
        }

        input:hover,
        select:hover,
        textarea:hover {
            border-color: rgba(56, 189, 248, .35);
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary);
            background: rgba(15, 23, 42, .95);
            box-shadow:
                0 0 0 3px rgba(56, 189, 248, .11),
                0 0 18px rgba(56, 189, 248, .08);
        }

        select option {
            background: #172338;
            color: white;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input[type="checkbox"],
        input[type="radio"] {
            width: auto;
            accent-color: var(--primary);
            box-shadow: none;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
            min-height: 49px;
            padding: 13px 18px;
            border: 1px solid rgba(125, 211, 252, .25);
            border-radius: 12px;
            background: linear-gradient(
                110deg,
                #0284c7,
                #2563eb,
                #6366f1
            );
            color: white;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(37, 99, 235, .2);
            transition: transform .25s ease,
                        box-shadow .25s ease,
                        filter .25s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 12px 30px rgba(37, 99, 235, .3),
                0 0 18px rgba(56, 189, 248, .12);
            filter: brightness(1.12);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:focus-visible,
        .back-link:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 4px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 23px;
            color: var(--primary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: color .2s ease;
        }

        .back-link:hover {
            color: #bae6fd;
        }

        .messages {
            margin-bottom: 22px;
        }

        .message {
            position: relative;
            padding: 13px 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 13px;
            line-height: 1.9;
            background: rgba(51, 65, 85, .55);
            border: 1px solid rgba(148, 163, 184, .18);
            color: #e2e8f0;
            backdrop-filter: blur(10px);
        }

        .message.success {
            background: rgba(16, 185, 129, .09);
            border-color: rgba(52, 211, 153, .25);
            color: #a7f3d0;
        }

        .message.error {
            background: rgba(244, 63, 94, .09);
            border-color: rgba(251, 113, 133, .25);
            color: #fecdd3;
        }

        .errorlist {
            color: #fda4af;
            font-size: 12px;
            line-height: 1.9;
            padding-right: 20px;
            margin-top: 8px;
        }

        .helptext {
            display: block;
            color: #94a3b8;
            font-size: 11px;
            line-height: 1.9;
            margin-top: 7px;
        }

        .footer {
            text-align: center;
            color: #64748b;
            font-size: 11px;
            line-height: 2;
            margin-top: 25px;
        }

        .footer::before {
            content: "";
            display: block;
            width: 55px;
            height: 1px;
            margin: 0 auto 15px;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(56, 189, 248, .5),
                transparent
            );
        }

        /* جدول‌های احتمالی فرم‌های حساب کاربری */

        .card table {
            width: 100%;
            border-collapse: collapse;
            color: var(--text-main);
        }

        .card th,
        .card td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            text-align: right;
        }

        /* انیمیشن */

        @keyframes accountFadeIn {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 22px 14px;
                align-items: flex-start;
            }

            .container {
                margin: auto 0;
            }

            .brand {
                margin-bottom: 22px;
            }

            .brand h2 {
                font-size: 25px;
            }

            .card {
                padding: 25px 20px;
                border-radius: 19px;
            }

            .card h1 {
                font-size: 20px;
            }

            input,
            select,
            textarea {
                padding: 13px;
            }

            .btn {
                min-height: 47px;
            }
        }

        @media (max-width: 360px) {
            .card {
                padding: 21px 16px;
            }

            .brand h2 {
                font-size: 22px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>

<body>

    <main class="container">

        <div class="brand">
            <h2>SmartFinance AI</h2>
            <p>مدیریت هوشمند امور مالی</p>
        </div>

        <section class="card">

            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <div class="message {{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            {% block content %}
            {% endblock %}

        </section>

        <div class="footer">
            SmartFinance AI © تمامی حقوق محفوظ است
        </div>

    </main>

    {% block extra_js %}{% endblock %}

</body>
</html>
